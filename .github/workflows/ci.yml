# Everything here runs without PixInsight.
#
# The checks that need the application — pi-doctor, pjsr-audit-params, and any
# processing at all — only run locally, because they need a licensed install
# with the XTerminator modules. What CI can cover is the pure logic: the
# classifier, view identifiers, bridge state, scoring, and the PJSR lint rules.

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - name: Tests
        run: npm test
      - name: PJSR lint
        # Catches the three PixInsight reports silently: a missing engine
        # directive, a slash-star pair inside a line comment, and legacy
        # enumeration access that reads as undefined.
        run: npm run lint:pjsr
      - name: Every module parses and its imports resolve
        # A broken import in a file no test touches would otherwise only surface
        # when a pipeline run reaches it, minutes into processing.
        run: npm run lint:imports
